services:
  init-sync-data:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - sync-data:/data

  sync:
    build: .
    restart: unless-stopped
    depends_on:
      init-sync-data:
        condition: service_completed_successfully
    environment:
      DATABASE_PATH: /data/sync.db
      PAIR_CODE: ${PAIR_CODE:?Set PAIR_CODE in .env}
    volumes:
      - sync-data:/data

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - sync
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?Set SYNC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sync-data:
  caddy-data:
  caddy-config:
