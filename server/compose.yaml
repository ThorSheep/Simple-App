services:
  init-sync-data:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - sync-data:/data

  sync:
    build: .
    restart: unless-stopped
    depends_on:
      init-sync-data:
        condition: service_completed_successfully
    environment:
      DATABASE_PATH: /data/sync.db
      PAIR_CODE: ${PAIR_CODE:?Set PAIR_CODE in .env}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_USER_ID: ${LINE_USER_ID:-}
      REMINDER_TIMEZONE: ${REMINDER_TIMEZONE:-Asia/Taipei}
      LINE_DAILY_SUMMARY_TIME: ${LINE_DAILY_SUMMARY_TIME:-07:00}
      LINE_DUE_REMINDER_TIME: ${LINE_DUE_REMINDER_TIME:-09:00}
      LINE_DUE_REMINDER_DAYS: ${LINE_DUE_REMINDER_DAYS:-3,1,0}
      REMINDER_CHECK_INTERVAL: ${REMINDER_CHECK_INTERVAL:-5m}
    volumes:
      - sync-data:/data

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - sync
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?Set SYNC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sync-data:
  caddy-data:
  caddy-config:
