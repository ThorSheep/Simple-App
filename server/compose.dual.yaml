services:
  init-prod-data:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - sync-prod-data:/data

  sync-prod:
    build: .
    restart: unless-stopped
    depends_on:
      init-prod-data:
        condition: service_completed_successfully
    environment:
      DATABASE_PATH: /data/sync.db
      PAIR_CODE: ${PROD_PAIR_CODE:?Set PROD_PAIR_CODE in .env}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_USER_ID: ${LINE_USER_ID:-}
      LINE_CHANNEL_SECRET: ${PROD_LINE_CHANNEL_SECRET:-}
      LINE_ALLOWED_USER_ID: ${PROD_LINE_ALLOWED_USER_ID:-}
      REMINDER_TIMEZONE: ${REMINDER_TIMEZONE:-Asia/Taipei}
      LINE_DAILY_SUMMARY_TIME: ${LINE_DAILY_SUMMARY_TIME:-07:00}
      LINE_DUE_REMINDER_TIME: ${LINE_DUE_REMINDER_TIME:-09:00}
      LINE_DUE_REMINDER_DAYS: ${LINE_DUE_REMINDER_DAYS:-3,1,0}
      REMINDER_CHECK_INTERVAL: ${REMINDER_CHECK_INTERVAL:-5m}
      MCP_BEARER_TOKEN: ${PROD_MCP_BEARER_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OPENAI_API_KEY: ${PROD_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${PROD_OPENAI_MODEL:-}
    volumes:
      - sync-prod-data:/data

  # The base compose file represents the test environment in dual mode. Never
  # allow test data to generate real LINE notifications.
  sync:
    environment:
      LINE_CHANNEL_ACCESS_TOKEN: ""
      LINE_USER_ID: ""
      LINE_CHANNEL_SECRET: ""
      LINE_ALLOWED_USER_ID: ""
      MCP_BEARER_TOKEN: ""
      OLLAMA_MODEL: ""
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""

  caddy:
    depends_on:
      - sync
      - sync-prod
    environment:
      SYNC_PROD_DOMAIN: ${SYNC_PROD_DOMAIN:?Set SYNC_PROD_DOMAIN in .env}
    volumes:
      - ./Caddyfile.dual:/etc/caddy/Caddyfile:ro

volumes:
  sync-prod-data:
