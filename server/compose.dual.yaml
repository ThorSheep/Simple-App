services:
  init-prod-data:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - sync-prod-data:/data

  sync-prod:
    build: .
    restart: unless-stopped
    depends_on:
      init-prod-data:
        condition: service_completed_successfully
    environment:
      DATABASE_PATH: /data/sync.db
      PAIR_CODE: ${PROD_PAIR_CODE:?Set PROD_PAIR_CODE in .env}
    volumes:
      - sync-prod-data:/data

  caddy:
    depends_on:
      - sync
      - sync-prod
    environment:
      SYNC_PROD_DOMAIN: ${SYNC_PROD_DOMAIN:?Set SYNC_PROD_DOMAIN in .env}
    volumes:
      - ./Caddyfile.dual:/etc/caddy/Caddyfile:ro

volumes:
  sync-prod-data:
